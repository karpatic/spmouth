<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spmouth</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Manrope:wght@500;600;700;800&display=swap"
    />
    <!-- Add Meyda.js for audio analysis -->
    <script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>
    <style>
      :root {
        --bg: #f4f9f4;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-2: rgba(245, 250, 247, 0.97);
        --surface-3: #e8f2ec;
        --text: #183029;
        --muted: #4f6b61;
        --border: rgba(24, 48, 41, 0.14);
        --border-strong: rgba(24, 48, 41, 0.22);
        --accent: #147a5d;
        --accent-strong: #0f6149;
        --accent-soft: #d7ede4;
        --accent-2: #ef7f56;
        --danger: #c54747;
        --focus: rgba(20, 122, 93, 0.3);
        --radius: 16px;
        --shadow-sm: 0 10px 28px rgba(17, 44, 34, 0.1);
        --shadow-lg: 0 26px 48px rgba(17, 44, 34, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Manrope", "Segoe UI", "Helvetica Neue", Arial,
          sans-serif;
        background:
          radial-gradient(
            1000px 720px at -8% -10%,
            rgba(239, 127, 86, 0.23),
            transparent 58%
          ),
          radial-gradient(
            940px 640px at 102% -12%,
            rgba(20, 122, 93, 0.2),
            transparent 58%
          ),
          linear-gradient(160deg, #f7fcf8 0%, #edf6f1 48%, #e8f2ec 100%);
        color: var(--text);
        line-height: 1.4;
      }

      #container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #topbar {
        position: sticky;
        top: 0;
        z-index: 1200;
        background: rgba(246, 252, 248, 0.86);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        animation: slide-down 0.45s ease both;
      }

      #controls {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 18px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
      }

      .brand {
        display: grid;
        gap: 5px;
      }

      .brand h1 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: #1a3a30;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .action-row {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .file-input {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      #imageInput {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .button {
        appearance: none;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        padding: 11px 17px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
        box-shadow: var(--shadow-sm);
        transition: transform 120ms ease, background 160ms ease,
          border-color 160ms ease, box-shadow 160ms ease;
      }

      .button:hover {
        background: var(--surface-2);
        border-color: rgba(20, 122, 93, 0.48);
        transform: translateY(-1px);
      }

      .button:active {
        transform: translateY(0);
      }

      .button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--focus), var(--shadow-sm);
        border-color: rgba(20, 122, 93, 0.72);
      }

      .button.primary {
        border-color: transparent;
        color: #f9fffc;
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          var(--accent-strong) 100%
        );
        box-shadow: 0 14px 28px rgba(16, 89, 67, 0.26);
      }

      .button.primary:hover {
        background: linear-gradient(
          135deg,
          #1c8a68 0%,
          var(--accent-strong) 100%
        );
      }

      .status {
        width: fit-content;
        max-width: 100%;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
      }

      .status strong {
        color: var(--text);
        font-weight: 700;
      }

      #mapWrap {
        position: relative;
        flex-grow: 1;
        min-height: 0;
        padding: 14px 16px 16px;
      }

      #map {
        height: 100%;
        width: 100%;
        border-radius: 24px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        background-color: #ebf3ef;
        background-image:
          linear-gradient(
            to right,
            rgba(24, 48, 41, 0.08) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(24, 48, 41, 0.08) 1px,
            transparent 1px
          ),
          radial-gradient(800px 520px at 22% 12%, rgba(20, 122, 93, 0.14), transparent 60%),
          radial-gradient(
            680px 420px at 88% 18%,
            rgba(239, 127, 86, 0.11),
            transparent 62%
          );
        background-size: 52px 52px, 52px 52px, auto, auto;
        background-position: center;
      }

      .hidden {
        display: none !important;
      }

      #mapHint {
        position: absolute;
        top: 34px;
        left: 42px;
        right: auto;
        bottom: auto;
        width: min(540px, calc(100vw - 110px));
        pointer-events: auto;
        z-index: 1000;
        display: grid;
        align-content: start;
        animation: rise-in 0.5s ease 0.15s both;
      }

      .hint-card {
        width: min(520px, 100%);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px 14px;
        box-shadow: var(--shadow-lg);
        backdrop-filter: blur(9px);
        pointer-events: auto;
      }

      .hint-actions {
        margin-top: 12px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .hint-title {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.24px;
      }

      .hint-list {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      /* Theme Leaflet controls to match */
      .leaflet-container {
        font: inherit;
        color: var(--text);
      }

      .leaflet-control-zoom,
      .leaflet-draw,
      .leaflet-bar {
        border: 1px solid var(--border) !important;
        border-radius: 12px !important;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(8px);
      }

      .leaflet-bar a,
      .leaflet-bar a:hover {
        background-color: rgba(255, 255, 255, 0.9) !important;
        color: var(--text) !important;
        border-bottom: 1px solid rgba(24, 48, 41, 0.14) !important;
      }

      .leaflet-bar a:hover {
        color: var(--accent) !important;
      }

      .leaflet-bar a:last-child {
        border-bottom: 0 !important;
      }

      .leaflet-bar a:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--focus);
      }

      .leaflet-control-attribution {
        background: rgba(255, 255, 255, 0.82) !important;
        color: rgba(24, 48, 41, 0.72) !important;
        border: 1px solid rgba(24, 48, 41, 0.12) !important;
        border-radius: 10px;
        padding: 2px 8px;
      }

      .leaflet-control-attribution a {
        color: rgba(24, 48, 41, 0.92) !important;
      }

      .leaflet-draw-toolbar a {
        background-color: rgba(255, 255, 255, 0.9) !important;
      }

      .leaflet-draw-toolbar a.leaflet-draw-toolbar-button-enabled,
      .leaflet-draw-toolbar a.leaflet-draw-toolbar-button-enabled:hover {
        background-color: rgba(20, 122, 93, 0.2) !important;
      }

      .layer-controls {
        position: absolute;
        top: 24px;
        right: 24px;
        width: min(320px, calc(100vw - 32px));
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        padding: 14px;
        z-index: 1100;
        border-radius: 18px;
        color: var(--text);
        backdrop-filter: blur(10px);
        animation: rise-in 0.5s ease 0.25s both;
      }

      .panel-title {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.06em;
        font-weight: 800;
        text-transform: uppercase;
      }

      .layer-control-item {
        margin: 10px 0;
      }

      .check-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      label {
        font-size: 13px;
        font-weight: 600;
      }

      .animation-button {
        width: 100%;
        margin-top: 6px;
        padding: 11px 12px;
        background: linear-gradient(
          135deg,
          rgba(20, 122, 93, 0.92) 0%,
          rgba(15, 97, 73, 0.94) 100%
        );
        color: #f6fffa;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        box-shadow: 0 12px 22px rgba(15, 97, 73, 0.25);
        transition: background 160ms ease, border-color 160ms ease,
          transform 120ms ease;
      }

      .animation-button:hover {
        background: linear-gradient(
          135deg,
          rgba(24, 138, 105, 0.95) 0%,
          rgba(15, 97, 73, 0.96) 100%
        );
        transform: translateY(-1px);
      }

      .animation-button:active {
        transform: translateY(0);
      }

      .animation-button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(20, 122, 93, 0.26);
      }

      .animation-button.active {
        background: linear-gradient(
          135deg,
          rgba(197, 71, 71, 0.9) 0%,
          rgba(160, 52, 52, 0.92) 100%
        );
      }

      .audio-controls {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed rgba(24, 48, 41, 0.2);
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        gap: 6px;
      }

      .row-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        border: 0;
        background: linear-gradient(
          90deg,
          rgba(20, 122, 93, 0.25),
          rgba(24, 48, 41, 0.12)
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        background: var(--accent);
        box-shadow: 0 2px 8px rgba(24, 48, 41, 0.25);
      }

      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        background: var(--accent);
        box-shadow: 0 2px 8px rgba(24, 48, 41, 0.25);
      }

      .slider-label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: rgba(24, 48, 41, 0.62);
      }

      .volume-meter {
        width: 100%;
        height: 11px;
        background-color: rgba(24, 48, 41, 0.08);
        border: 1px solid rgba(24, 48, 41, 0.12);
        border-radius: 999px;
        overflow: hidden;
      }

      .volume-meter-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: none !important;
      }

      /* Collapse button styles */
      .collapse-button {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: rgba(20, 122, 93, 0.08);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        width: 31px;
        height: 31px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .collapse-button:hover {
        background-color: var(--accent-soft);
        border-color: rgba(20, 122, 93, 0.32);
      }

      /* Collapsed state styles */
      .layer-controls.collapsed {
        width: 52px;
        height: 52px;
        overflow: hidden;
        padding: 0;
      }

      .layer-controls.collapsed .collapse-button {
        top: 8px;
        right: 8px;
      }

      .layer-controls.collapsed .layer-control-content {
        display: none;
      }

      @keyframes slide-down {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 860px) {
        #controls {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .action-row {
          justify-content: flex-start;
        }

        #mapHint {
          top: 20px;
          left: 20px;
          width: min(520px, calc(100vw - 72px));
        }
      }

      @media (max-width: 680px) {
        .brand h1 {
          font-size: 24px;
        }

        #mapWrap {
          padding: 10px;
        }

        #map {
          border-radius: 18px;
        }

        #mapHint {
          top: 14px;
          left: 14px;
          width: calc(100vw - 46px);
        }

        .layer-controls {
          top: auto;
          bottom: 22px;
          right: 14px;
          left: 14px;
          width: auto;
        }

        .layer-controls.collapsed {
          left: auto;
          right: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="topbar">
        <div id="controls">
          <div class="brand">
            <h1>Spmouth</h1>
            <p class="status" id="statusText">
              <strong>Step 1:</strong> Upload a photo to begin.
            </p>
          </div>
          <div class="action-row">
            <div class="file-input">
              <input type="file" id="imageInput" accept="image/*" />
              <label for="imageInput" class="button primary">Upload photo</label>
            </div>
          </div>
        </div>
      </div>

      <div id="mapWrap">
        <div id="map"></div>
        <div id="mapHint">
          <div class="hint-card">
            <p class="hint-title">Quick start</p>
            <ol class="hint-list">
              <li>Click <strong>Upload photo</strong> and pick an image.</li>
              <li>Use the draw tools to outline the mouth (polygon or rectangle).</li>
              <li>Turn on <strong>Microphone</strong> to animate.</li>
            </ol>
            <div class="hint-actions">
              <button type="button" id="dismissHint" class="button">Got it</button>
            </div>
          </div>
        </div>

      <div id="layer-controls" class="layer-controls hidden">
        <button id="collapse-controls" class="collapse-button">−</button>
        <div class="layer-control-content">
          <div class="panel-title">Layers & Animation</div>
          <div class="layer-control-item">
            <div class="check-row">
              <input type="checkbox" id="toggle-original" checked />
              <label for="toggle-original">Show original image</label>
            </div>
          </div>
          <div class="layer-control-item">
            <div class="check-row">
              <input type="checkbox" id="toggle-selection" />
              <label for="toggle-selection">Show mouth cut-out</label>
            </div>
          </div>
          <div class="layer-control-item">
            <button id="animateBtn" class="animation-button">
              Start Microphone Animation
            </button>
          </div>
          <div class="audio-controls hidden" id="audio-controls">
            <div class="row">
              <div class="row-title">
                <span>Sensitivity</span>
                <span id="sensitivity-value">5</span>
              </div>
              <input
                type="range"
                min="1"
                max="20"
                value="5"
                id="sensitivity-slider"
              />
            </div>
            <div class="row">
              <div class="row-title">
                <span>Movement distance</span>
                <span id="movement-value">20%</span>
              </div>
              <input
                type="range"
                min="1"
                max="100"
                value="20"
                id="movement-slider"
              />
              <div class="slider-label">
                <span>1%</span>
                <span>100%</span>
              </div>
            </div>
            <div class="row">
              <div class="row-title">
                <span>Volume</span>
                <span id="volume-value">0</span>
              </div>
              <div class="volume-meter" aria-hidden="true">
                <div class="volume-meter-fill" id="volume-meter-fill"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script>
      const map = L.map("map", { crs: L.CRS.Simple, minZoom: -3 });
      let imageLayer = null,
        drawnItems = new L.FeatureGroup(),
        originalImage = null,
        currentPolygon = null,
        imageHeight = 0,
        selectionOverlay = null,
        selectionCoords = null;

      const statusTextEl = document.getElementById("statusText");
      const mapHintEl = document.getElementById("mapHint");
      const dismissHintBtn = document.getElementById("dismissHint");

      if (dismissHintBtn && mapHintEl) {
        dismissHintBtn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          mapHintEl.classList.add("hidden");
        });
      }

      // Audio variables
      let audioContext = null;
      let microphone = null;
      let analyser = null;
      let isAnimating = false;
      let animationId = null; 
      let sensitivityFactor = 5;
      let movementDistance = 20; // Default movement distance as percentage
      let meydaAnalyzer = null; // Add Meyda analyzer variable

      map.addLayer(drawnItems);

      const drawControl = new L.Control.Draw({
        draw: {
          polyline: false,
          polygon: true,
          circle: false,
          marker: false,
          circlemarker: false,
          rectangle: true,
        },
        edit: { featureGroup: drawnItems, remove: true },
      });

      function convertToImageCoords(latLng) {
        if (originalImage) {
          return {
            x: Math.round(latLng.lng),
            y: originalImage.height - Math.round(latLng.lat),
          };
        }
        return { x: 0, y: 0 };
      }

      function cropImageFromPolygon(img, polygonPoints) {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        let minX = Infinity,
          minY = Infinity,
          maxX = 0,
          maxY = 0;

        for (const point of polygonPoints) {
          minX = Math.min(minX, point.x);
          minY = Math.min(minY, point.y);
          maxX = Math.max(maxX, point.x);
          maxY = Math.max(maxY, point.y);
        }

        minX = Math.max(0, Math.floor(minX));
        minY = Math.max(0, Math.floor(minY));
        maxX = Math.min(img.width, Math.ceil(maxX));
        maxY = Math.min(img.height, Math.ceil(maxY));

        const width = maxX - minX;
        const height = maxY - minY;

        if (width <= 0 || height <= 0) {
          console.error("Invalid crop dimensions", width, height);
          return null;
        }

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, minX, minY, width, height, 0, 0, width, height);

        return {
          canvas: canvas,
          bounds: { minX, minY, maxX, maxY },
          width: width,
          height: height,
        };
      }

      function showSelectionArea(points) {
        if (!originalImage) return null;

        const debugCanvas = document.createElement("canvas");
        const ctx = debugCanvas.getContext("2d");

        debugCanvas.width = originalImage.width;
        debugCanvas.height = originalImage.height;

        ctx.drawImage(originalImage, 0, 0);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;
        ctx.beginPath();

        for (let i = 0; i < points.length; i++) {
          const point = points[i];
          if (i === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        }

        ctx.closePath();
        ctx.stroke();
        return debugCanvas;
      }

      function updateSelectionOverlay(points, yOffset = 0) {
        if (originalImage) {
          selectionCoords = points; // Store the points for later use

          // Create a copy of the original image and replace selected area with white
          const modifiedImage = replaceSelectionWithWhite(
            originalImage,
            points
          );

          // Remove previous image layer
          if (imageLayer) {
            map.removeLayer(imageLayer);
          }

          // Create and add a new image overlay with the modified image
          const bounds = [
            [0, 0],
            [imageHeight, originalImage.width],
          ];
          imageLayer = L.imageOverlay(modifiedImage.toDataURL(), bounds);

          // Also create the cropped selection as a separate layer
          // Instead of using cropImageFromPolygon which creates a rectangle,
          // create an exact polygon-shaped selection
          const selectionCanvas = document.createElement("canvas");
          const ctx = selectionCanvas.getContext("2d");

          selectionCanvas.width = originalImage.width;
          selectionCanvas.height = originalImage.height;

          // Create a clipping path for the polygon with optional Y offset for animation
          ctx.beginPath();
          for (let i = 0; i < points.length; i++) {
            const point = points[i];
            if (i === 0) ctx.moveTo(point.x, point.y + yOffset);
            else ctx.lineTo(point.x, point.y + yOffset);
          }
          ctx.closePath();
          ctx.clip();

          // Draw the original image (only the clipped part will show)
          ctx.drawImage(originalImage, 0, 0);

          // Remove previous overlay if exists
          if (selectionOverlay) {
            map.removeLayer(selectionOverlay);
          }

          // Create data URL from the canvas
          const dataUrl = selectionCanvas.toDataURL();

          // Use the full image bounds for the overlay
          const selectionBounds = [
            [0, 0],
            [imageHeight, originalImage.width],
          ];

          // Create and add the overlay
          selectionOverlay = L.imageOverlay(dataUrl, selectionBounds, {
            opacity: 0.8,
            interactive: false,
            className: "selection-overlay",
          })//.addTo(map);

          imageLayer.addTo(map);

          // Show layer controls
          document.getElementById("layer-controls").classList.remove("hidden");
          document.getElementById("toggle-original").checked = true;

          document.getElementById("toggle-selection").checked = true;
          toggleSelectionOverlay(true);

          // Remove the blue selection outline
          map.removeLayer(drawnItems);
        }
      }

      function replaceSelectionWithWhite(img, points) {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;

        // Draw the original image first
        ctx.drawImage(img, 0, 0);

        // Fill the selected area with white
        ctx.fillStyle = "white";
        ctx.beginPath();

        for (let i = 0; i < points.length; i++) {
          const point = points[i];
          if (i === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        }

        ctx.closePath();
        ctx.fill();

        return canvas;
      }

      async function setupMicrophone() {
        try {
          // Create audio context and connect a microphone to an analyser
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          microphone = audioContext.createMediaStreamSource(stream);
          
          // Create Meyda analyzer instead of using raw AudioContext analyzer
          meydaAnalyzer = Meyda.createMeydaAnalyzer({
            audioContext: audioContext,
            source: microphone,
            bufferSize: 512,
            featureExtractors: ["rms"],
            callback: handleAudioFeatures
          });
          
          // Start the Meyda analyzer
          meydaAnalyzer.start();
          
          document.getElementById("audio-controls").classList.remove("hidden"); 
          document.getElementById("animateBtn").textContent = "Stop Microphone Animation";
          document.getElementById("animateBtn").classList.add("active");
          if (statusTextEl) {
            statusTextEl.innerHTML =
              "<strong>Microphone on:</strong> speak to animate the mouth.";
          }
          return true;
        } catch (error) {
          console.error("Error accessing microphone:", error);
          alert("Could not access microphone: " + error.message);
          return false;
        }
      }

      function stopMicrophone() {
        if (microphone && audioContext) {
          // Stop Meyda analyzer if it exists
          if (meydaAnalyzer) {
            meydaAnalyzer.stop();
            meydaAnalyzer = null;
          }
          
          // Disconnect microphone
          microphone.disconnect();
          microphone = null;

          // Cancel animation
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          
          moveSelectionLayer(0);

          // Update UI
          document.getElementById("animateBtn").textContent =
            "Start Microphone Animation";
          document.getElementById("animateBtn").classList.remove("active");
          document.getElementById("audio-controls").classList.add("hidden");

          // Reset volume meter
          document.getElementById("volume-meter-fill").style.width = "0%";
          document.getElementById("volume-value").textContent = "0";

          if (statusTextEl) {
            statusTextEl.innerHTML =
              "<strong>Step 3:</strong> Start the microphone animation.";
          }
        }
      }

      // New function to handle audio features from Meyda
      function handleAudioFeatures(features) {
        if (!isAnimating || !selectionCoords) return;
        
        // Get RMS value from Meyda features
        const rms = features.rms;
        
        // Scale RMS to a usable range (0-100)
        const volumeLevel = Math.min(100, rms * 100 * sensitivityFactor);
        
        // Update volume meter display
        const volumeMeter = document.getElementById("volume-meter-fill");
        volumeMeter.style.transition = "none";
        volumeMeter.style.webkitTransition = "none";
        volumeMeter.style.width = `${volumeLevel}%`;
        document.getElementById("volume-value").textContent = Math.round(rms * 100); 
        volumeMeter.offsetHeight; 
        moveSelectionLayer(volumeLevel);
      }
      function moveSelectionLayer(volumeLevel) {
        if (selectionOverlay) {
          // Calculate maximum movement as percentage of image height
          const maxMovement = (movementDistance / 100) * imageHeight;
          
          // Scale movement by volume level
          const yOffset = -(volumeLevel / 100) * maxMovement; 
          selectionOverlay.setOpacity(0.8);
          selectionOverlay.setBounds([
            [0 + yOffset, 0],
            [imageHeight + yOffset, originalImage.width],
          ]);
        }
      }

      function toggleAnimation() {
        if (isAnimating) { 
          isAnimating = false;
          stopMicrophone();
        } else { 
          if (selectionCoords) {
            isAnimating = true;
            setupMicrophone();
          }
        }
      }

      document
        .getElementById("imageInput")
        .addEventListener("change", function (e) {
          if (e.target.files && e.target.files[0]) {
            if (statusTextEl) {
              statusTextEl.innerHTML = "<strong>Loading image…</strong>";
            }

            const reader = new FileReader();

            reader.onload = function (event) {
              if (imageLayer) map.removeLayer(imageLayer);
              drawnItems.clearLayers();

              const img = new Image();
              img.onload = function () {
                originalImage = img;

                if (mapHintEl) mapHintEl.classList.add("hidden");

                const width = this.width;
                const height = this.height;
                imageHeight = height;
                const bounds = [
                  [0, 0],
                  [height, width],
                ];

                imageLayer = L.imageOverlay(event.target.result, bounds);
                imageLayer.addTo(map);
                map.fitBounds(bounds);

                if (!map.drawControl) {
                  map.addControl(drawControl);
                  map.drawControl = true;
                }

                document
                  .getElementById("layer-controls")
                  .classList.remove("hidden");
                document.getElementById("toggle-original").checked = true;

                if (statusTextEl) {
                  statusTextEl.innerHTML =
                    "<strong>Step 2:</strong> Outline the mouth with a polygon or rectangle.";
                }
              };

              img.src = event.target.result;
            };

            reader.readAsDataURL(e.target.files[0]);
          } 
          if (isAnimating) {
            toggleAnimation();
          }
        });

      // Add event listeners for layer toggles
      document
        .getElementById("toggle-original")
        .addEventListener("change", function () {
          if (imageLayer) {
            if (this.checked) {
              map.addLayer(imageLayer);
            } else {
              map.removeLayer(imageLayer);
            }
          }
        });

      function toggleSelectionOverlay(checked) {
        if (selectionOverlay) {
          if (checked) {
        map.addLayer(selectionOverlay);
          } else {
        map.removeLayer(selectionOverlay);
          }
        }
      }

      document
        .getElementById("toggle-selection")
        .addEventListener("change", function () {
          toggleSelectionOverlay(this.checked);
        });

      // Collapse/expand controls functionality
      document
        .getElementById("collapse-controls")
        .addEventListener("click", function() {
          const controlsPanel = document.getElementById("layer-controls");
          const isCollapsed = controlsPanel.classList.toggle("collapsed");
          this.textContent = isCollapsed ? "+" : "−";
        });

      // Add animation button event listener
      document
        .getElementById("animateBtn")
        .addEventListener("click", toggleAnimation);

      // Add sensitivity slider event listener
      document
        .getElementById("sensitivity-slider")
        .addEventListener("input", function () {
          sensitivityFactor = parseInt(this.value);
          const sensitivityValueEl = document.getElementById("sensitivity-value");
          if (sensitivityValueEl) sensitivityValueEl.textContent = String(sensitivityFactor);
        });

      // Add movement slider event listener
      document
        .getElementById("movement-slider")
        .addEventListener("input", function () {
          movementDistance = parseInt(this.value);
          document.getElementById("movement-value").textContent = movementDistance + "%";
        });

      map.on(L.Draw.Event.CREATED, function (event) {
        try {
          drawnItems.clearLayers();
          const layer = event.layer;
          drawnItems.addLayer(layer);
          currentPolygon = layer;

          // Stop animation if running when creating a new selection
          if (isAnimating) {
            toggleAnimation();
          }

          if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
            const latLngs = layer.getLatLngs()[0];
            const points = latLngs.map((latLng) =>
              convertToImageCoords(latLng)
            );
            updateSelectionOverlay(points);

            if (statusTextEl) {
              statusTextEl.innerHTML =
                "<strong>Step 3:</strong> Start the microphone animation.";
            }
          }
        } catch (error) {
          console.error("Error during crop operation:", error);
          alert("Error processing selection: " + error.message);
        }
      });

      map.on("draw:edited", function (e) {
        try {
          e.layers.eachLayer(function (layer) {
            if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
              currentPolygon = layer;
              const latLngs = layer.getLatLngs()[0];
              const points = latLngs.map((latLng) =>
                convertToImageCoords(latLng)
              );
              updateSelectionOverlay(points);
            }
          });
        } catch (error) {
          console.error("Error during edit crop operation:", error);
          alert("Error updating selection: " + error.message);
        }
      });

      map.on("draw:deleted", function () {
        if (selectionOverlay) {
          map.removeLayer(selectionOverlay);
          selectionOverlay = null;
          document.getElementById("toggle-selection").checked = false;

          // Add back the drawing layer if it was removed
          if (!map.hasLayer(drawnItems)) {
            map.addLayer(drawnItems);
          }
        }
      });
    </script>
  </body>
</html>
